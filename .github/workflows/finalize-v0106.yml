name: Finalize v0106

on:
  push:
    branches:
      - release/v0.10.6-interactive-docs

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Finalize when all comparator parts exist
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f .tmp/comparator_v10_parts/part11 ]; then
            echo "Comparator staging is not complete yet."
            exit 0
          fi

          mkdir -p comparator
          cat .tmp/comparator_v10_parts/part* > comparator/scRareBench_Multi_Report_Comparator_v10.html
          echo "84e563834760dd4c89db1b043b8e6a5c631c8e1082eceba97431a2f12d7ff342  comparator/scRareBench_Multi_Report_Comparator_v10.html" | sha256sum -c -

          sed -i 's/0\.10\.5/0.10.6/g' src/scrarebench/_version.py CITATION.cff DESIGN_NOTES.md tests/test_release_contract_v0104.py
          sed -i 's/date-released: 2026-08-30/date-released: 2026-08-31/' CITATION.cff
          find notebooks -maxdepth 1 -name '*.ipynb' -print0 | xargs -0 sed -i 's/v0\.10\.5/v0.10.6/g; s/0\.10\.5/0.10.6/g'

          {
            printf '%s\n' '# Changelog' ''
            printf '%s\n' '## 0.10.6 — interactive reporting and comparator release' ''
            printf '%s\n' '- Promoted self-contained interactive HTML reports as a first-class public workflow and added `INTERACTIVE_REPORTS.md`.'
            printf '%s\n' '- Added standalone Comparator v10 for side-by-side method/dataset comparison, aggregate/individual/specific-seed views, and schema-1.6 identity/provenance-aware grouping.'
            printf '%s\n' '- Comparator v10 prefers stored dataset identity, suppresses exact duplicate runs, and rejects conflicting same-seed runs instead of silently replacing or double-counting them.'
            printf '%s\n' '- Documented native multi-seed management, aggregate mean ± sample SD, seed-specific geometry, reversible exclude/restore controls, and Save Updated Report behavior.'
            printf '%s\n' '- Added repository screenshot placeholders only; documentation images can be added later without affecting package/runtime behavior.'
            printf '%s\n' '- No benchmark metric formula, failure threshold, integration algorithm, or scientific evaluation logic changed in this release.' ''
            tail -n +3 CHANGELOG.md
          } > /tmp/CHANGELOG.md
          mv /tmp/CHANGELOG.md CHANGELOG.md

          rm -rf .tmp/comparator_v10_parts
          rm -f .tmp/v0106_comparator.xz.b64
          rmdir .tmp 2>/dev/null || true
          rm -f .github/workflows/finalize-v0106.yml

          bad_src="$(git diff --name-only | grep '^src/' | grep -v '^src/scrarebench/_version.py$' || true)"
          if [ -n "$bad_src" ]; then
            echo "Unexpected scientific source changes:" >&2
            echo "$bad_src" >&2
            exit 1
          fi

          grep -q '__version__ = "0.10.6"' src/scrarebench/_version.py
          grep -q 'version: 0.10.6' CITATION.cff
          grep -q '# scRareBench 0.10.6' DESIGN_NOTES.md
          grep -q 'Current release: `0.10.6`' README.md
          grep -q '0.10.6' notebooks/*.ipynb
          test -f INTERACTIVE_REPORTS.md

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "Release 0.10.6 interactive reporting and Comparator v10"
          git push origin HEAD:release/v0.10.6-interactive-docs
