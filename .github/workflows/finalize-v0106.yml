name: Finalize v0.10.6 interactive docs

on:
  push:
    branches:
      - release/v0.10.6-interactive-docs
    paths:
      - .tmp/v0106_comparator.xz.b64

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct comparator and synchronize release metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p comparator
          base64 -d .tmp/v0106_comparator.xz.b64 | xz -d > comparator/scRareBench_Multi_Report_Comparator_v10.html
          echo "84e563834760dd4c89db1b043b8e6a5c631c8e1082eceba97431a2f12d7ff342  comparator/scRareBench_Multi_Report_Comparator_v10.html" | sha256sum -c -

          python - <<'PY'
          from pathlib import Path

          version_file = Path('src/scrarebench/_version.py')
          text = version_file.read_text()
          if '__version__ = "0.10.5"' in text:
              text = text.replace('__version__ = "0.10.5"', '__version__ = "0.10.6"')
          elif '__version__ = "0.10.6"' not in text:
              raise SystemExit('Unexpected package version state')
          version_file.write_text(text)

          for path in sorted(Path('notebooks').glob('*.ipynb')):
              text = path.read_text()
              new = text.replace('v0.10.5', 'v0.10.6').replace('scRareBench 0.10.5', 'scRareBench 0.10.6')
              if new != text:
                  path.write_text(new)

          changelog = Path('CHANGELOG.md')
          text = changelog.read_text()
          if '## 0.10.6 — interactive reporting and comparator release' not in text:
              entry = '''## 0.10.6 — interactive reporting and comparator release

- Promoted self-contained interactive HTML reports as a first-class public workflow and added `INTERACTIVE_REPORTS.md`.
- Added standalone Comparator v10 for side-by-side method/dataset comparison, aggregate/individual/specific-seed views, and schema-1.6 identity/provenance-aware grouping.
- Comparator v10 prefers stored dataset identity, suppresses exact duplicate runs, and rejects conflicting same-seed runs instead of silently replacing or double-counting them.
- Documented native multi-seed management, aggregate mean ± sample SD, seed-specific geometry, reversible exclude/restore controls, and Save Updated Report behavior.
- Added repository screenshot placeholders only; documentation images can be added later without affecting package/runtime behavior.
- No benchmark metric formula, failure threshold, integration algorithm, or scientific evaluation logic changed in this release.

'''
              text = text.replace('# Changelog\n\n', '# Changelog\n\n' + entry, 1)
              changelog.write_text(text)
          PY

          rm -f .tmp/v0106_comparator.xz.b64
          rmdir .tmp 2>/dev/null || true
          rm -f .github/workflows/finalize-v0106.yml

          # Scope guard: scientific source implementation must remain unchanged except version metadata.
          bad_src="$(git diff --name-only | grep '^src/' | grep -v '^src/scrarebench/_version.py$' || true)"
          if [ -n "$bad_src" ]; then
            echo "Unexpected source changes:" >&2
            echo "$bad_src" >&2
            exit 1
          fi

          grep -q 'Current release: `0.10.6`' README.md
          grep -q 'v0.10.6' README.md
          grep -q 'Multi-Report Comparator v10' comparator/scRareBench_Multi_Report_Comparator_v10.html
          test -f INTERACTIVE_REPORTS.md

      - name: Commit clean release branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md INTERACTIVE_REPORTS.md CHANGELOG.md src/scrarebench/_version.py notebooks comparator .github/workflows/finalize-v0106.yml .tmp || true
          git status --short
          git commit -m "Release 0.10.6 interactive reporting and Comparator v10"
          git push origin HEAD:release/v0.10.6-interactive-docs
