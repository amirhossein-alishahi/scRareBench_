name: Inspect staged docs payload
on:
  push:
    branches: [docs/interactive-reports-comparator-v10]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode staged payload
        shell: bash
        run: |
          set -euo pipefail
          cat .tmp/interactive_docs/part* | base64 -d > /tmp/payload.xz
          echo "compressed_size=$(stat -c%s /tmp/payload.xz)"
          sha256sum /tmp/payload.xz
          xz -dc /tmp/payload.xz > /tmp/payload.raw
          echo "raw_size=$(stat -c%s /tmp/payload.raw)"
          sha256sum /tmp/payload.raw
          file /tmp/payload.raw
          if tar -tf /tmp/payload.raw >/dev/null 2>&1; then
            tar -tvf /tmp/payload.raw
          else
            python - <<'PY'
          from pathlib import Path
          p=Path('/tmp/payload.raw')
          print(p.read_bytes()[:200])
          PY
          fi
