name: Apply and validate ChatGPT scRareBench overlay

on:
  push:
    branches:
      - chatgpt/highlevel-multiseed

permissions:
  contents: write
  issues: read

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Reconstruct and verify exact overlay
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EXPECTED_SHA256: bfbe74d80a1d26a6819a60dc9a5b52a84f492ac781218e5ab058faab4c172c99
        run: |
          python - <<'PY'
          import base64, hashlib, json, os, re, shutil, urllib.request, zipfile
          from pathlib import Path

          repo = os.environ['REPO']
          token = os.environ['GH_TOKEN']
          expected = os.environ['EXPECTED_SHA256']
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'scRareBench-overlay-validator',
          }

          def get_json(url):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req) as response:
                  return json.load(response)

          issue = get_json(f'https://api.github.com/repos/{repo}/issues/1')
          comments = []
          page = 1
          while True:
              batch = get_json(f'https://api.github.com/repos/{repo}/issues/1/comments?per_page=100&page={page}')
              comments.extend(batch)
              if len(batch) < 100:
                  break
              page += 1

          def payload_after(text, marker):
              if marker not in text:
                  return None
              tail = text.split(marker, 1)[1]
              lines = [line.strip() for line in tail.splitlines() if line.strip()]
              payload = ''.join(lines)
              if not re.fullmatch(r'[A-Za-z0-9+/=]+', payload):
                  raise RuntimeError(f'Non-base64 content after {marker}')
              return payload

          chunks = {1: payload_after(issue.get('body') or '', 'PART=1/5')}
          for comment in comments:
              body = comment.get('body') or ''
              p2 = payload_after(body, 'PART=2/5')
              if p2 is not None:
                  chunks[2] = p2
                  continue
              match = re.search(r'SEQ=(\d+)/8', body)
              if match:
                  idx = int(match.group(1))
                  chunks[idx] = payload_after(body, match.group(0))

          missing = [i for i in range(1, 9) if not chunks.get(i)]
          if missing:
              raise RuntimeError(f'Missing overlay payload chunks: {missing}')

          encoded = ''.join(chunks[i] for i in range(1, 9))
          raw = base64.b64decode(encoded, validate=True)
          observed = hashlib.sha256(raw).hexdigest()
          print('overlay zip bytes:', len(raw))
          print('overlay sha256:', observed)
          if observed != expected:
              raise RuntimeError(f'ZIP SHA256 mismatch: {observed} != {expected}')

          zip_path = Path('/tmp/scrarebench-overlay.zip')
          zip_path.write_bytes(raw)
          with zipfile.ZipFile(zip_path) as zf:
              bad = zf.testzip()
              if bad is not None:
                  raise RuntimeError(f'Corrupt ZIP member: {bad}')
              extract = Path('/tmp/scrarebench-overlay')
              if extract.exists():
                  shutil.rmtree(extract)
              zf.extractall(extract)

          roots = [p for p in extract.iterdir() if p.is_dir()]
          if len(roots) != 1:
              raise RuntimeError(f'Expected one overlay root, got {roots}')
          root = roots[0]
          manifest_path = root / 'OVERLAY_MANIFEST.json'
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          entries = manifest['files']
          for entry in entries:
              rel = entry['path']
              path = root / rel
              data = path.read_bytes()
              if len(data) != int(entry['size']):
                  raise RuntimeError(f'Size mismatch for {rel}')
              digest = hashlib.sha256(data).hexdigest()
              if digest != entry['sha256']:
                  raise RuntimeError(f'SHA256 mismatch for {rel}: {digest}')
          print('manifest verified files:', len(entries))

          skip = {'APPLY_NOTES.md', 'OVERLAY_MANIFEST.json'}
          copied = []
          checkout = Path.cwd()
          for entry in entries:
              rel = entry['path']
              if rel in skip:
                  continue
              src = root / rel
              dst = checkout / rel
              dst.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(src, dst)
              copied.append(rel)
          print('overlay files copied:', len(copied))
          print('\n'.join(copied))
          PY

      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Compile Python sources and tests
        run: python -m compileall -q src tests

      - name: Parse every notebook code cell
        run: |
          python - <<'PY'
          import ast, json
          from pathlib import Path
          notebooks = sorted(Path('notebooks').glob('*.ipynb'))
          if not notebooks:
              raise SystemExit('No notebooks found')
          for nb_path in notebooks:
              nb = json.loads(nb_path.read_text(encoding='utf-8'))
              for index, cell in enumerate(nb.get('cells', [])):
                  if cell.get('cell_type') == 'code':
                      ast.parse(''.join(cell.get('source', [])), filename=f'{nb_path}:cell-{index}')
          print(f'AST parse passed for {len(notebooks)} notebooks')
          PY

      - name: Run high-risk scientific and API tests with warnings as errors
        run: |
          python -m pytest -W error \
            tests/test_high_level_api.py \
            tests/test_multiseed_v0101.py \
            tests/test_metrics_edges_v094.py \
            tests/test_support_adjusted_knn_v095.py \
            tests/test_provenance_hardening_v0104.py \
            tests/test_scientific_adversarial_v094.py \
            tests/test_scib_backend.py \
            tests/test_dashboard_payload.py \
            tests/test_dashboard_interactions.py \
            tests/test_release_contract_v0104.py

      - name: Run full test suite
        run: python -m pytest

      - name: Validate release notebooks
        run: python scripts/check_notebooks.py

      - name: Build wheel and inspect packaged assets
        run: |
          python -m build --wheel
          python - <<'PY'
          import zipfile
          from pathlib import Path
          wheel = sorted(Path('dist').glob('scrarebench-*.whl'))[-1]
          with zipfile.ZipFile(wheel) as zf:
              names = set(zf.namelist())
          required_suffixes = [
              'scrarebench/assets/dashboard.css',
              'scrarebench/assets/dashboard.js',
              'scrarebench/assets/dashboard_template.html',
              'scrarebench/metric_registry.py',
              'scrarebench/multiseed.py',
              'scrarebench/delivery.py',
          ]
          missing = [item for item in required_suffixes if item not in names]
          if missing:
              raise SystemExit(f'Missing wheel assets/modules: {missing}')
          print('wheel packaging validation passed:', wheel)
          PY

      - name: Verify method-agnostic Colab contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          high = sorted(Path('notebooks').glob('*HighLevel*.ipynb'))
          if len(high) < 3:
              raise SystemExit(f'Expected at least 3 high-level notebooks, found {len(high)}')
          for path in high:
              nb = json.loads(path.read_text(encoding='utf-8'))
              code = '\n'.join(''.join(c.get('source', [])) for c in nb['cells'] if c.get('cell_type') == 'code')
              if 'git+https://github.com/amirhossein-alishahi/scRareBench_.git@main' not in code:
                  raise SystemExit(f'{path} does not install the validated main branch')
          generic = Path('notebooks/scRareBench_CustomMethod_HighLevel_Colab.ipynb')
          code = '\n'.join(''.join(c.get('source', [])) for c in json.loads(generic.read_text())['cells'] if c.get('cell_type') == 'code')
          for token in ['MethodSpec', 'benchmark_method', 'dependencies', 'runner']:
              if token not in code:
                  raise SystemExit(f'Generic notebook missing {token}')
          if 'scrarebench.methods' in code:
              raise SystemExit('Generic notebook embeds/depends on a scRareBench method registry')
          print('method-agnostic Colab contract passed')
          PY

      - name: Commit validated overlay to branch
        run: |
          git status --short
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add HIGH_LEVEL_API.md METHOD_INTEGRATION_GUIDE.md pyproject.toml src tests notebooks
          if git diff --cached --quiet; then
            echo 'No overlay changes to commit.'
            exit 0
          fi
          git commit -m 'Integrate high-level method API, multi-seed benchmarking, and rare-aware metrics'
          git push origin HEAD:chatgpt/highlevel-multiseed
