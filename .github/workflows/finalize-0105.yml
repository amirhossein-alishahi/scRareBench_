name: Finalize scRareBench 0.10.5

on:
  push:
    branches: [chatgpt/highlevel-multiseed]

permissions:
  contents: write

jobs:
  final-validation:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Reconstruct exact overlay and prepare release
        run: python .tmp/finalize_0105.py

      - name: Install and dependency health
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          python -m pip check

      - name: Compile and validate all notebooks
        run: |
          python -m compileall -q src tests scripts examples
          python scripts/check_notebooks.py
          python - <<'PY'
          import ast, json
          from pathlib import Path
          notebooks = sorted(Path('notebooks').glob('*.ipynb'))
          assert len(notebooks) == 10, len(notebooks)
          for path in notebooks:
              text = path.read_text(encoding='utf-8')
              assert 'scRareBench_.git@v0.10.5' in text, path
              assert 'scRareBench_.git@main' not in text, path
              for i, cell in enumerate(json.loads(text).get('cells', [])):
                  if cell.get('cell_type') == 'code':
                      ast.parse(''.join(cell.get('source', [])), filename=f'{path}:cell-{i}')
          print('All 10 notebooks parse and pin v0.10.5')
          PY

      - name: High-risk scientific and API tests with warnings as errors
        run: |
          python -m pytest -W error \
            tests/test_high_level_api.py \
            tests/test_multiseed_v0101.py \
            tests/test_metrics_edges_v094.py \
            tests/test_support_adjusted_knn_v095.py \
            tests/test_provenance_hardening_v0104.py \
            tests/test_scientific_adversarial_v094.py \
            tests/test_scib_backend.py \
            tests/test_dashboard_payload.py \
            tests/test_dashboard_interactions.py \
            tests/test_release_contract_v0104.py

      - name: Full repository test suite
        run: python -m pytest

      - name: Build wheel and verify packaged developer surface
        run: |
          python -m build --wheel
          python - <<'PY'
          import zipfile
          from pathlib import Path
          wheel = sorted(Path('dist').glob('scrarebench-*.whl'))[-1]
          assert '0.10.5' in wheel.name, wheel
          with zipfile.ZipFile(wheel) as zf:
              names = set(zf.namelist())
          required = {
              'scrarebench/highlevel.py', 'scrarebench/multiseed.py', 'scrarebench/delivery.py',
              'scrarebench/metric_registry.py', 'scrarebench/assets/dashboard.css',
              'scrarebench/assets/dashboard.js', 'scrarebench/assets/dashboard_template.html',
          }
          assert not (required - names), sorted(required - names)
          print('Wheel validated:', wheel)
          PY

      - name: Generic method contract smoke
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from scrarebench import MethodSpec, benchmark_method, benchmark_latent
          assert MethodSpec and callable(benchmark_method) and callable(benchmark_latent)
          p = Path('notebooks/scRareBench_CustomMethod_HighLevel_Colab.ipynb')
          code = '\n'.join(''.join(c.get('source', [])) for c in json.loads(p.read_text())['cells'] if c.get('cell_type') == 'code')
          for token in ('MethodSpec', 'MethodOutput', 'benchmark_method', 'METHOD_DEPENDENCIES', 'runner=run_user_method'):
              assert token in code, token
          assert 'scrarebench.methods' not in code
          print('Generic method high-level contract validated')
          PY

      - name: Commit validated release tree
        run: |
          rm -rf .tmp dist build
          rm -f .github/workflows/finalize-0105.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git status --short
          git commit -m 'Release scRareBench 0.10.5 with high-level multi-seed API'
          git push origin HEAD:chatgpt/highlevel-multiseed
