name: Apply v0.10.6 release audit fixes

on:
  push:
    branches: ["fix/v0.10.6-release-audit"]
    paths: [".github/workflows/fix-v0106-release-audit.yml"]

permissions:
  contents: write

jobs:
  apply-fixes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v0.10.6-release-audit
          fetch-depth: 0

      - name: Patch audited files
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          # 1) Fail closed when a declared scIB count layer is missing.
          benchmark = Path("src/scrarebench/benchmark.py")
          text = benchmark.read_text(encoding="utf-8")
          old = '''    if counts is not None and counts not in adata.layers:\n        counts = None\n'''
          new = '''    if counts is not None and counts not in adata.layers:\n        if cfg.run_scib:\n            source = "dataset metadata" if count_layer is _UNSET else "benchmark_latent(count_layer=...)"\n            raise KeyError(\n                f"count_layer={counts!r} from {source} is required for scIB evaluation but is not present "\n                "in adata.layers. Provide a validated raw-count layer, pass count_layer=None to use adata.X "\n                "explicitly, or disable scIB with config={'run_scib': False}."\n            )\n        counts = None\n'''
          if old not in text:
              raise SystemExit("benchmark.py target block not found")
          benchmark.write_text(text.replace(old, new, 1), encoding="utf-8")

          # 2) Harden the high-level Dataset 2 scVI notebook and align its HVG policy
          #    with the validated detailed Dataset 2 workflows.
          nb_path = Path("notebooks/scRareBench_scVI_HighLevel_Dataset2_mBDRC_Colab.ipynb")
          nb = json.loads(nb_path.read_text(encoding="utf-8"))

          def src(cell):
              return "".join(cell.get("source", []))

          load_idx = next(i for i, c in enumerate(nb["cells"]) if c.get("cell_type") == "code" and "adata = load_dataset(2)" in src(c))
          helper_marker = "def ensure_counts_layer(adata, layer_key=\"counts\")"
          if not any(helper_marker in src(c) for c in nb["cells"]):
              helper_code = '''# Dataset 2 count/HVG contract: recover a validated raw-count layer before method copies are made.\nimport numpy as np\nimport pandas as pd\nimport scipy.sparse as sp\n\ndef sampled_count_diagnostics(matrix, max_values=100_000, seed=42):\n    values = matrix.data if sp.issparse(matrix) else np.asarray(matrix).ravel()\n    if len(values) > max_values:\n        rng = np.random.default_rng(seed)\n        values = values[rng.choice(len(values), size=max_values, replace=False)]\n    values = np.asarray(values, dtype=float)\n    finite = values[np.isfinite(values)]\n    return {\n        \"finite_fraction\": float(np.mean(np.isfinite(values))) if len(values) else 1.0,\n        \"minimum\": float(np.min(finite)) if len(finite) else 0.0,\n        \"nonnegative\": bool(len(finite) == 0 or finite.min() >= 0),\n        \"integer_like\": bool(len(finite) == 0 or np.allclose(finite, np.rint(finite), atol=1e-6)),\n    }\n\ndef _copy_matrix(matrix):\n    return matrix.copy().tocsr() if sp.issparse(matrix) else np.asarray(matrix).copy()\n\ndef ensure_counts_layer(adata, layer_key=\"counts\"):\n    if layer_key in adata.layers:\n        diag = sampled_count_diagnostics(adata.layers[layer_key])\n        if diag[\"nonnegative\"] and diag[\"integer_like\"]:\n            return f\"layers/{layer_key}\", diag\n        raise ValueError(f\"Existing {layer_key!r} layer is not nonnegative integer-like raw counts: {diag}\")\n\n    if adata.raw is not None:\n        raw_names = pd.Index(adata.raw.var_names.astype(str))\n        current_names = pd.Index(adata.var_names.astype(str))\n        positions = raw_names.get_indexer(current_names)\n        if np.all(positions >= 0):\n            matrix = adata.raw.X[:, positions]\n            diag = sampled_count_diagnostics(matrix)\n            if diag[\"nonnegative\"] and diag[\"integer_like\"]:\n                adata.layers[layer_key] = _copy_matrix(matrix)\n                return \"raw.X aligned to adata.var_names\", diag\n\n    diag = sampled_count_diagnostics(adata.X)\n    if diag[\"nonnegative\"] and diag[\"integer_like\"]:\n        adata.layers[layer_key] = _copy_matrix(adata.X)\n        return \"X\", diag\n\n    raise ValueError(\n        \"Could not locate nonnegative integer-like raw counts for Dataset 2. \"\n        f\"layers={list(adata.layers)}, raw_present={adata.raw is not None}, X_diagnostics={diag}\"\n    )\n\nif info.get(\"scib_hvg_batch_mode\") != \"global\":\n    raise RuntimeError(f\"Dataset 2 is expected to use global HVG selection, observed metadata: {info}\")\ncount_layer = info.get(\"count_layer\") or \"counts\"\ncount_source, count_diagnostics = ensure_counts_layer(adata, count_layer)\nprint(\"Raw-count source:\", count_source)\nprint(\"Count diagnostics:\", count_diagnostics)\n'''
              nb["cells"].insert(load_idx + 1, {
                  "cell_type": "code",
                  "execution_count": None,
                  "metadata": {},
                  "outputs": [],
                  "source": helper_code.splitlines(keepends=True),
              })

          config_idx = next(i for i, c in enumerate(nb["cells"]) if c.get("cell_type") == "code" and "METHOD_CONFIG = {" in src(c))
          config_code = '''# Reproducibility controls: method seeds vary; benchmark seed stays fixed.\nMETHOD_SEEDS = [42, 123, 2026]   # use [42] for a quick single-seed run\nBENCHMARK_SEED = 42\n\n# Dataset 2 uses the validated global Seurat-v3 HVG policy. The combined\n# donor_id × assay evaluation batch is intentionally NOT passed to HVG selection.\nMETHOD_CONFIG = {\n    \"n_hvg\": 4000,\n    \"hvg_policy\": \"global_seurat_v3_raw_counts\",\n    \"hvg_batch_key\": None,\n    \"hvg_span\": 0.3,\n    \"n_hidden\": 128,\n    \"n_latent\": 30,\n    \"n_layers\": 2,\n    \"dropout_rate\": 0.10,\n    \"dispersion\": \"gene-batch\",\n    \"gene_likelihood\": \"nb\",\n    \"max_epochs\": 200,\n    \"batch_size\": 256,\n}\n'''
          nb["cells"][config_idx]["source"] = config_code.splitlines(keepends=True)

          runner_idx = next(i for i, c in enumerate(nb["cells"]) if c.get("cell_type") == "code" and "def run_scvi(" in src(c))
          runner_code = '''import numpy as np\nimport scanpy as sc\nimport scvi\nfrom scrarebench import MethodOutput\n\ndef run_scvi(method_adata, seed, config):\n    batch_key = info[\"batch_key\"]\n    count_layer = info.get(\"count_layer\") or \"counts\"\n    if count_layer not in method_adata.layers:\n        raise KeyError(\n            f\"Validated raw-count layer {count_layer!r} is missing from the method copy. \"\n            \"Run the Dataset 2 count-preparation cell before benchmark_method().\"\n        )\n\n    hvg_kwargs = {\n        \"layer\": count_layer,\n        \"flavor\": \"seurat_v3\",\n        \"n_top_genes\": min(int(config[\"n_hvg\"]), method_adata.n_vars),\n        \"span\": float(config[\"hvg_span\"]),\n        \"subset\": False,\n        \"check_values\": True,\n    }\n    if config.get(\"hvg_batch_key\") is not None:\n        hvg_kwargs[\"batch_key\"] = config[\"hvg_batch_key\"]\n    sc.pp.highly_variable_genes(method_adata, **hvg_kwargs)\n\n    hvg_mask = method_adata.var[\"highly_variable\"].fillna(False).to_numpy()\n    expected_hvg = min(int(config[\"n_hvg\"]), method_adata.n_vars)\n    if int(hvg_mask.sum()) != expected_hvg:\n        raise RuntimeError(\n            f\"Expected {expected_hvg} HVGs under the fixed Dataset 2 policy but selected {int(hvg_mask.sum())}.\"\n        )\n    method_adata = method_adata[:, hvg_mask].copy()\n\n    scvi.settings.seed = int(seed)\n    scvi.model.SCVI.setup_anndata(method_adata, layer=count_layer, batch_key=batch_key)\n    model = scvi.model.SCVI(\n        method_adata,\n        n_hidden=config[\"n_hidden\"],\n        n_latent=config[\"n_latent\"],\n        n_layers=config[\"n_layers\"],\n        dropout_rate=config[\"dropout_rate\"],\n        dispersion=config[\"dispersion\"],\n        gene_likelihood=config[\"gene_likelihood\"],\n    )\n    model.train(\n        max_epochs=config[\"max_epochs\"],\n        train_size=0.90,\n        validation_size=0.10,\n        batch_size=config[\"batch_size\"],\n        early_stopping=True,\n        early_stopping_patience=20,\n        accelerator=\"auto\",\n        devices=\"auto\",\n    )\n    latent = model.get_latent_representation()\n    return MethodOutput(latent=latent, barcodes=method_adata.obs_names)\n'''
          nb["cells"][runner_idx]["source"] = runner_code.splitlines(keepends=True)
          nb_path.write_text(json.dumps(nb, indent=1, ensure_ascii=False) + "\n", encoding="utf-8")

          # 3) Regression tests for both fixes.
          test_path = Path("tests/test_release_audit_v0106.py")
          test_path.write_text('''from __future__ import annotations\n\nimport json\nfrom pathlib import Path\n\nimport anndata as ad\nimport numpy as np\nimport pandas as pd\nimport pytest\n\nfrom scrarebench import benchmark_latent\n\n\ndef test_declared_missing_count_layer_fails_closed_for_scib(tmp_path):\n    obs = pd.DataFrame(\n        {\"celltype\": [\"A\", \"A\", \"B\", \"B\"], \"BATCH\": [\"b1\", \"b2\", \"b1\", \"b2\"]},\n        index=[\"c0\", \"c1\", \"c2\", \"c3\"],\n    )\n    adata = ad.AnnData(X=np.ones((4, 3), dtype=float), obs=obs)\n    adata.uns[\"scrarebench\"] = {\n        \"name\": \"demo\",\n        \"dataset_key\": \"demo\",\n        \"label_key\": \"celltype\",\n        \"batch_key\": \"BATCH\",\n        \"count_layer\": \"counts\",\n        \"scenario_key\": \"scrarebench_scenario\",\n        \"scib_hvg_batch_mode\": \"global\",\n    }\n    with pytest.raises(KeyError, match=r\"count_layer='counts'.*not present\"):\n        benchmark_latent(\n            adata,\n            np.arange(8, dtype=float).reshape(4, 2),\n            method=\"Demo\",\n            output_dir=tmp_path / \"out\",\n            config={\n                \"run_scib\": True,\n                \"write_interactive_report\": False,\n                \"write_pdf_report\": False,\n                \"create_bundle\": False,\n            },\n        )\n\n\ndef test_dataset2_high_level_notebook_uses_validated_count_and_global_hvg_contract():\n    path = Path(\"notebooks/scRareBench_scVI_HighLevel_Dataset2_mBDRC_Colab.ipynb\")\n    nb = json.loads(path.read_text(encoding=\"utf-8\"))\n    code_cells = [\"\".join(c.get(\"source\", [])) for c in nb[\"cells\"] if c.get(\"cell_type\") == \"code\"]\n    code = \"\\n\".join(code_cells)\n    runner = next(cell for cell in code_cells if \"def run_scvi(\" in cell)\n\n    assert \"ensure_counts_layer(adata, count_layer)\" in code\n    assert '\"hvg_policy\": \"global_seurat_v3_raw_counts\"' in code\n    assert '\"hvg_batch_key\": None' in code\n    assert 'if config.get(\"hvg_batch_key\") is not None' in runner\n    assert \"batch_key=batch_key\" not in runner.split(\"sc.pp.highly_variable_genes\", 1)[1].split(\"scvi.settings.seed\", 1)[0]\n''', encoding="utf-8")

          # 4) Modernize license metadata to remove the setuptools deprecation.
          pyproject = Path("pyproject.toml")
          text = pyproject.read_text(encoding="utf-8")
          text = text.replace('requires = ["setuptools>=69", "wheel"]', 'requires = ["setuptools>=77", "wheel"]', 1)
          text = text.replace('  "License :: OSI Approved :: MIT License",\n', '', 1)
          text = text.replace('license = {text = "MIT"}', 'license = "MIT"', 1)
          pyproject.write_text(text, encoding="utf-8")

          # 5) Replace stale screenshot placeholders with the images already in the repo.
          guide = Path("INTERACTIVE_REPORTS.md")
          text = guide.read_text(encoding="utf-8")
          replacements = {
              '> **Screenshot placeholder — add:** `docs/images/report_overview.webp`': '![scRareBench interactive report overview](docs/images/report_overview.webp)',
              '> **Screenshot placeholder — add:** `docs/images/report_rare_explorer.webp`': '![scRareBench Rare-cell Explorer](docs/images/report_rare_explorer.webp)',
              '> **Screenshot placeholder — add:** `docs/images/report_seed_stability.webp`': '![scRareBench multi-seed Seed Stability view](docs/images/report_seed_stability.webp)',
              '> **Screenshot placeholder — add:** `docs/images/comparator_methods_v10.webp`': '![scRareBench Multi-Report Comparator v10](docs/images/comparator_methods_v10.webp)',
          }
          for old_line, new_line in replacements.items():
              if old_line not in text:
                  raise SystemExit(f"Missing documentation placeholder: {old_line}")
              text = text.replace(old_line, new_line, 1)
          heading = "# 5. Adding the documentation screenshots later"
          if heading in text:
              text = text.split(heading, 1)[0].rstrip() + '''\n\n# 5. Documentation screenshots\n\nThe repository includes four WebP previews used by the README and this guide:\n\n- `docs/images/report_overview.webp`\n- `docs/images/report_rare_explorer.webp`\n- `docs/images/report_seed_stability.webp`\n- `docs/images/comparator_methods_v10.webp`\n\nThese images are documentation-only. The benchmark logic, notebooks, generated reports, and Comparator do not depend on them at runtime.\n'''
          guide.write_text(text, encoding="utf-8")

          images_readme = Path("docs/images/README.md")
          images_readme.write_text('''# Documentation screenshots\n\nThis directory contains the WebP previews used by the repository documentation:\n\n- `report_overview.webp` — interactive report **Overview**.\n- `report_rare_explorer.webp` — **Rare-cell Explorer** diagnostics.\n- `report_seed_stability.webp` — native **Seed Stability** / multi-seed workspace.\n- `comparator_methods_v10.webp` — **Multi-Report Comparator v10** methods-on-dataset view.\n\nThe root `README.md` and `INTERACTIVE_REPORTS.md` reference these files directly. They are documentation-only assets and are not required by scRareBench at runtime.\n\nWhen replacing a screenshot, keep the same filename unless every Markdown reference is updated as well. Avoid private paths, credentials, tokens, or unrelated browser chrome in captures.\n''', encoding="utf-8")

          # The temporary mutation workflow must not be part of the final branch diff.
          Path(".github/workflows/fix-v0106-release-audit.yml").unlink()
          PY

      - name: Validate patch shape
        run: |
          git diff --check
          python -m compileall -q src tests scripts examples
          python scripts/check_notebooks.py
          git diff --name-only

      - name: Commit audited fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/scrarebench/benchmark.py \
                  notebooks/scRareBench_scVI_HighLevel_Dataset2_mBDRC_Colab.ipynb \
                  tests/test_release_audit_v0106.py \
                  pyproject.toml INTERACTIVE_REPORTS.md docs/images/README.md \
                  .github/workflows/fix-v0106-release-audit.yml
          git commit -m "Fix v0.10.6 release audit findings"
          git push origin HEAD:fix/v0.10.6-release-audit
