name: Finalize scRareBench 0.10.5

on:
  push:
    branches:
      - chatgpt/highlevel-multiseed

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Reconstruct verified overlay and synchronize release
        run: |
          python .tmp/finalize_overlay.py
          python - <<'PY'
          from pathlib import Path
          p = Path('tests/test_provenance_hardening_v0104.py')
          text = p.read_text(encoding='utf-8')
          if 'import importlib.util' not in text:
              text = text.replace('import hashlib\n', 'import hashlib\nimport importlib.util\n', 1)
          p.write_text(text, encoding='utf-8')
          PY

      - name: Install and check dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          python -m pip check

      - name: Compile all Python sources
        run: python -m compileall -q src tests scripts examples

      - name: Validate notebook syntax and release refs
        run: |
          python scripts/check_notebooks.py
          python - <<'PY'
          import ast, json
          from pathlib import Path
          notebooks = sorted(Path('notebooks').glob('*.ipynb'))
          assert len(notebooks) == 10, len(notebooks)
          for path in notebooks:
              text = path.read_text(encoding='utf-8')
              assert 'scRareBench_.git@v0.10.5' in text, path
              assert 'scRareBench_.git@main' not in text, path
              for i, cell in enumerate(json.loads(text).get('cells', [])):
                  if cell.get('cell_type') == 'code':
                      ast.parse(''.join(cell.get('source', [])), filename=f'{path}:cell-{i}')
          print('10 notebooks: syntax and v0.10.5 refs OK')
          PY

      - name: Run high-risk tests with warnings as errors
        run: |
          python -m pytest -W error \
            tests/test_high_level_api.py \
            tests/test_multiseed_v0101.py \
            tests/test_metrics_edges_v094.py \
            tests/test_support_adjusted_knn_v095.py \
            tests/test_provenance_hardening_v0104.py \
            tests/test_scientific_adversarial_v094.py \
            tests/test_scib_backend.py \
            tests/test_dashboard_payload.py \
            tests/test_dashboard_interactions.py \
            tests/test_release_contract_v0104.py

      - name: Run full test suite
        run: python -m pytest

      - name: Build and inspect wheel
        run: |
          python -m build --wheel
          python - <<'PY'
          import zipfile
          from pathlib import Path
          wheel = sorted(Path('dist').glob('scrarebench-*.whl'))[-1]
          assert '0.10.5' in wheel.name, wheel.name
          with zipfile.ZipFile(wheel) as zf:
              names = set(zf.namelist())
          required = {
              'scrarebench/assets/dashboard.css',
              'scrarebench/assets/dashboard.js',
              'scrarebench/assets/dashboard_template.html',
              'scrarebench/metric_registry.py',
              'scrarebench/multiseed.py',
              'scrarebench/delivery.py',
              'scrarebench/highlevel.py',
          }
          missing = sorted(required - names)
          assert not missing, missing
          print('wheel OK:', wheel)
          PY

      - name: Validate generic high-level developer contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('notebooks/scRareBench_CustomMethod_HighLevel_Colab.ipynb')
          nb = json.loads(p.read_text(encoding='utf-8'))
          code = '\n'.join(''.join(c.get('source', [])) for c in nb['cells'] if c.get('cell_type') == 'code')
          for token in ('MethodSpec', 'benchmark_method', 'dependencies', 'runner'):
              assert token in code, token
          assert 'scrarebench.methods' not in code
          from scrarebench import MethodSpec, benchmark_method, benchmark_latent
          assert MethodSpec and callable(benchmark_method) and callable(benchmark_latent)
          print('generic method contract OK')
          PY

      - name: Commit only after every validation passed
        run: |
          rm -rf .tmp
          rm -f .github/workflows/apply-chatgpt-overlay.yml
          rm -f .github/workflows/finalize-chatgpt-release.yml
          rm -rf dist build *.egg-info src/*.egg-info
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git status --short
          git commit -m 'Release scRareBench 0.10.5 with high-level multi-seed API'
          git push origin HEAD:chatgpt/highlevel-multiseed
